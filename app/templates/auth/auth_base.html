<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TrainerApp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sign-in.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-signin w-100 m-auto">
        <form action="" method="post" novalidate>
            {{ form.hidden_tag() }}
            <div class="text-center mb-3">
                <img src="{{ url_for('static', filename='assets/dumbbell-svgrepo-com.svg') }}" alt="Logo" width="72" height="57">
                <h3 class="h3 mb-2 fw-normal mt-2">{% block heading %}Ingresa tus datos{% endblock %}</h3>
                {% block subtitle %}{% endblock %}
            </div>

            {% block content %}{% endblock %}

            <div class="mt-3">
                {{ form.submit(class="btn btn-primary w-100 py-2") }}
            </div>
            
            {% block footer %}{% endblock %}
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
